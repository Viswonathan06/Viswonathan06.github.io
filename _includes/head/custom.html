<!-- start custom head snippets -->

<!-- Inter typeface from Google Fonts -->

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<!-- Custom CSS for improved styling -->

<!-- Favicon: letter V -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>

<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<meta name="theme-color" content="#ffffff"/>

<!-- Author expand/collapse for bibliography -->
<script>
  document.addEventListener('click', function(e) {
    if (!e.target.classList.contains('expand-btn')) return;
    var btn = e.target;
    var li = btn.closest('li.pub-entry');
    var extra = li.querySelector('.author-extra');
    var truncated = li.querySelector('.author-truncated');
    if (!extra) return;
    extra.hidden = false;
    truncated.hidden = true;
  });
</script>

<!-- Underline the nav link for the home-page section currently on screen -->
<script>
  document.addEventListener('DOMContentLoaded', function() {
    var links = Array.prototype.slice.call(document.querySelectorAll('.site-nav__links a[href*="#"]'));
    var sections = links.map(function(a) { return document.getElementById(a.hash.slice(1)); });
    if (!sections.some(Boolean)) return;
    var masthead = document.querySelector('.masthead');

    function update() {
      var offset = (masthead ? masthead.offsetHeight : 0) + 40;
      var atBottom = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2;
      var current = -1;
      sections.forEach(function(s, i) {
        if (s && (atBottom || s.getBoundingClientRect().top <= offset)) current = i;
      });
      links.forEach(function(a, i) { a.classList.toggle('is-active', i === Math.max(current, 0)); });
    }

    window.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update);
    update();
  });
</script>

<!-- end custom head snippets -->
